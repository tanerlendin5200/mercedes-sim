<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mercedes CL63 AMG — Sürüş</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Segoe UI,sans-serif;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#hud{position:fixed;bottom:0;left:0;right:0;height:170px;pointer-events:none;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,0.6) 30%,rgba(0,0,0,0.95))}
.hiz{position:absolute;bottom:55px;left:40px;color:#00ff88;font-size:65px;font-weight:700;text-shadow:0 0 15px rgba(0,255,136,0.25);font-family:Courier New,monospace;line-height:1;letter-spacing:1px}
.hiz small{font-size:12px;color:#555;margin-left:5px;letter-spacing:2px}
.devir{position:absolute;bottom:78px;left:40px;color:#ff8800;font-size:11px;font-family:Courier New,monospace}
.devir span{font-size:17px;color:#ffaa00}
.dbar{position:absolute;bottom:47px;left:40px;width:200px;height:3px;background:#111;border-radius:2px;border:1px solid #1a1a1a;overflow:hidden}
.ddolu{height:100%;width:0;background:linear-gradient(90deg,#00ff88,#88ff00,#ffaa00,#ff4400);border-radius:2px;transition:width .03s}
.vit{position:absolute;bottom:100px;right:80px;text-align:center}
.vit .h{color:#fff;font-size:34px;font-weight:700;font-family:Courier New,monospace;text-shadow:0 0 8px rgba(255,255,255,0.08)}
.vit span{display:block;font-size:10px;color:#444;letter-spacing:2px;margin-top:-2px}
.hb{position:absolute;bottom:55px;right:80px;text-align:right;font-family:Courier New,monospace;font-size:11px;color:#444;line-height:1.5}
.hb .v{color:#888;font-size:13px}
.dirg{position:absolute;bottom:25px;right:40px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.08);font-size:20px;transition:transform .06s}
#dbg{position:fixed;top:5px;left:5px;color:rgba(255,255,255,0.08);font-size:10px;font-family:Courier New,monospace;pointer-events:none;z-index:50;line-height:1.4;max-width:300px}
</style>
</head>
<body>
<div id="hud">
  <div class="hiz">0<small>KM/H</small></div>
  <div class="devir">DEVİR <span id="dr">0</span> rpm</div>
  <div class="dbar"><div class="ddolu" id="dd"></div></div>
  <div class="vit"><div class="h" id="vh">N</div><span>VİTES</span></div>
  <div class="hb"><div><span class="v" id="hk">0</span> km/h</div><div><span class="v" id="hm">0</span> mph</div></div>
  <div class="dirg" id="dg">⟳</div>
</div>
<canvas id="c"></canvas>
<div id="dbg">yükleniyor...</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function r(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}r();
window.addEventListener('resize',r);

const k={};let mx=0,my=-0.1;
let h=0,d=650,km=0,vi=1,va='N',dr=0,ry=0,yz=0,gt=0,fa=0,fb=0;

document.addEventListener('keydown',e=>{const s=e.key.toLowerCase();k[s]=true;if(' /arrowup/arrowdown/arrowleft/arrowright/shift/control/f/r'.includes(' '+s))e.preventDefault()});
document.addEventListener('keyup',e=>{k[e.key.toLowerCase()]=false});
C.addEventListener('mousemove',e=>{mx+=e.movementX*0.003;my+=e.movementY*0.002;my=Math.max(-0.5,Math.min(0.6,my))});

// Trafik
const tf=[];
for(let i=0;i<20;i++)tf.push({z:-(Math.random()*900+30),x:(Math.random()-0.5)*12,hs:0.3+Math.random()*1.8,cl:`hsl(${Math.random()*360},55%,${30+Math.random()*30}%)`});

// Ses
let ac,o,g,f,os,gs,gn;
function sesB(){try{ac=new(window.AudioContext||window.webkitAudioContext)();o=ac.createOscillator();g=ac.createGain();f=ac.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=120;f.Q.value=3;g.gain.value=0;o.connect(f);f.connect(g);g.connect(ac.destination);o.start();os=ac.createOscillator();gs=ac.createGain();os.type='sine';gs.gain.value=0;os.connect(gs);gs.connect(ac.destination);os.start();const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const n=ac.createBufferSource();n.buffer=buf;n.loop=true;gn=ac.createGain();gn.gain.value=0;n.connect(gn);gn.connect(ac.destination);n.start();const go=ac.createOscillator(),gg=ac.createGain();go.type='sine';gg.gain.value=0;go.connect(gg);gg.connect(ac.destination);go.start();window._s={o,g,f,os,gs,gn,go,gg};ac.resume()}catch(e){}}
function sesG(dev,gz){const s=window._s;if(!s)return;try{const t=ac.currentTime,b=28+(dev/1000)*28;s.o.frequency.setTargetAtTime(b,t,.04);s.f.frequency.setTargetAtTime(90+(dev/1000)*90+gz*60,t,.04);s.g.gain.setTargetAtTime(Math.min(.08,gz*.035+(dev/1000)*.006),t,.04);s.os.frequency.setTargetAtTime(b*.5,t,.04);s.gs.gain.setTargetAtTime(Math.min(.1,gz*.05+(dev/1000)*.004),t,.04);s.gn.gain.setTargetAtTime(Math.min(.015,gz*.006+(dev/1000)*.001),t,.04)}catch(e){}}
function vs(y){const s=window._s;if(!s)try{const t=ac.currentTime;s.go.frequency.setValueAtTime(y?400:200,t);s.go.frequency.exponentialRampToValueAtTime(y?100:80,t+.08);s.gg.gain.setValueAtTime(.03,t);s.gg.gain.exponentialRampToValueAtTime(.001,t+.1)}catch(e){}}

const OR=[0,0,.082,.145,.225,.33,.47,.65,.88];
let lt=0,dl=0;

function loop(t){
  r();dl=Math.min((t-lt)/1000,.05);lt=t;if(gt>0)gt-=dl;

  ctx.fillStyle='#080818';ctx.fillRect(0,0,W,H);

  const gz=(k.w||k.arrowup)?1:0,fr=(k.s||k.arrowdown)?1:0,ef=k[' ']?1:0;

  // Vites
  if(k.r&&vi!==0){vi=0;va='R';gt=.4;vs(0)}else if(vi===0&&!k.r){vi=1;va='N';gt=.2}
  else if(k.shift&>>=2&&vi<8&&h>3){vi++;va=['N','N','1','2','3','4','5','6','7'][vi];gt=.4;d*=.65;vs(1);k.shift=0}
  else if(k.control&&vi>2){vi--;va=['N','N','1','2','3','4','5','6','7'][vi];gt=.35;d=Math.min(7000,d*1.35);vs(0);k.control=0}
  else if(km<1&&vi>1&&!k.shift&&!k.control&>[<.01){vi=1;va='N'}

  // Devir
  if(vi===1)d+=(700+gz*3500-d)*dl*2.5;
  else if(vi===0){d+=(800+gz*3800-d)*dl*3;d=Math.max(600,Math.min(6200,d))}
  else{d+=(750+(.3+gz*.7)*6200-d)*dl*3.5;d=Math.max(600,Math.min(7500,d));if(gt>0)d*=.97}

  // Hız
  if(vi===1)h*=.97;
  else if(vi===0){h+=(-gz*12-h*.5)*dl;h=Math.max(-28,Math.min(0,h))}
  else{const x=Math.min(vi,8),or=OR[x]||.08,it=gz*or*135,mf=(1-gz)*h*.12,st=h*.22,hv=h*h*.0012,fk=fr*20,efk=ef*40;h+=(it-st-hv-mf-fk-efk)*dl;h=Math.max(0,Math.min(330,h))}
  km=Math.round(h*3.6);

  // Direksiyon
  const hf=Math.min(1,h/30),dh=.12+hf*.88;
  if(k.a||k.arrowleft)dr-=dl*3.8*dh;else if(k.d||k.arrowright)dr+=dl*3.8*dh;else dr*=.92;
  dr=Math.max(-1,Math.min(1,dr));ry+=dr*dl*1.3*hf;yz+=h*dl;
  if(k.f&&!fb){fa=!fa;fb=1}if(!k.f)fb=0;

  sesG(d,gz);

  tf.forEach(t=>{t.z+=.5+t.hs;if(t.z>20)t.z=-900-Math.random()*200});

  // === 3D ÇİZİM ===
  const cx=W/2,cy=H*.35,fv=Math.max(300,Math.min(1000,W*.7));
  const kx=Math.sin(ry)*dr*2,yt=dr*.3;

  // Yol
  for(let i=40;i>=0;i--){
    const z=(i*15-yz%15)%700-100;
    if(z<-3)continue;
    const sc=fv/(z+5),ys=fv/(z+5);
    const x1=(-6-kx+yt*(1-sc/fv))*sc+cx,x2=(6-kx+yt*(1-sc/fv))*sc+cx;
    const y1=cy+2*ys,y2=cy+8*ys;
    const dk=Math.max(0,Math.min(1,(z+100)/400)),gr=Math.floor(35+dk*30);
    ctx.fillStyle=`rgb(${gr},${gr+5},${gr+3})`;ctx.fillRect(Math.min(x1,x2)-2,y1,Math.abs(x2-x1)+4,y2-y1);
    if(i%2===0){const lw=.2*sc;ctx.fillStyle=`rgba(255,255,255,${.2+dk*.5})`;ctx.fillRect(cx-lw/2,y1,lw,y2-y1)}
    ctx.strokeStyle=`rgb(${Math.floor(150+dk*105)},${Math.floor(150+dk*105)},${Math.floor(150+dk*105)})`;ctx.lineWidth=Math.max(1,.07*sc);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-.4*sc,y2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y1);ctx.lineTo(x2+.4*sc,y2);ctx.stroke();
  }

  // Arabalar
  tf.forEach(t=>{
    const rz=(-t.z-yz)%700-100;if(rz<-3||rz>50)return;
    const s=fv/(rz+5),tx=(t.x-kx)*s+cx,ty=cy+2.5*s,tw=2.5*s,th=.9*s;
    if(tw<3)return;
    ctx.fillStyle=t.cl;ctx.fillRect(tx-tw/2,ty,tw,th);
    ctx.fillStyle='rgba(68,136,204,.3)';ctx.fillRect(tx-tw*.3,ty-th*.15,tw*.6,th*.3);
    ctx.fillStyle='#ff0';ctx.fillRect(tx-tw*.2,ty,th*.08,th*.06);
    ctx.fillRect(tx+tw*.12,ty,th*.08,th*.06);
    ctx.fillStyle='#f00';ctx.fillRect(tx-tw*.2,ty+th*.55,th*.08,th*.06);
    ctx.fillRect(tx+tw*.12,ty+th*.55,th*.08,th*.06);
  });

  // İç mekan
  const sw=W*.045;
  ctx.fillStyle='#080808';ctx.fillRect(0,cy-15,sw,H*.35);ctx.fillRect(W-sw,cy-15,sw,H*.35);
  ctx.fillStyle='#0c0c0c';ctx.fillRect(0,0,W,cy*.65);
  ctx.fillStyle='rgba(80,150,255,.05)';ctx.fillRect(sw+5,cy*.6,W-2*sw-10,cy*.28);
  ctx.fillStyle='#0f0f0f';ctx.fillRect(sw,cy+3,W-2*sw,20);
  ctx.fillStyle='#0c0c0c';ctx.fillRect(sw,cy-4,W-2*sw,10);

  // Direksiyon
  const dcx=W*.27,dcy=cy+28,dr2=Math.min(W,H)*.05;
  ctx.save();ctx.translate(dcx,dcy);ctx.rotate(dr*.35);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=Math.max(2,dr2*.18);
  ctx.beginPath();ctx.arc(0,0,dr2-ctx.lineWidth/2,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#222';ctx.lineWidth=Math.max(1,dr2*.05);
  ctx.beginPath();ctx.arc(0,0,dr2*.55,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,0,dr2*.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#888';ctx.beginPath();for(let i=0;i<3;i++){const a=i*2.094-Math.PI/2;i===0?ctx.moveTo(Math.cos(a)*dr2*.1,Math.sin(a)*dr2*.1):ctx.lineTo(Math.cos(a)*dr2*.1,Math.sin(a)*dr2*.1)};ctx.fill();
  ctx.restore();

  // Göstergeler
  const gr=Math.min(W,H)*.03;
  ctx.strokeStyle='rgba(0,255,136,.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(W*.35,cy+14,gr,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(0,255,136,.1)';
  ctx.beginPath();ctx.arc(W*.35,cy+14,gr-2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,136,0,.35)';
  ctx.beginPath();ctx.arc(W*.65,cy+14,gr,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,136,0,.1)';
  ctx.beginPath();ctx.arc(W*.65,cy+14,gr-2,0,Math.PI*2);ctx.fill();

  // Orta ekran & konsol
  ctx.fillStyle='rgba(0,20,40,.65)';
  ctx.fillRect(W/2-W*.06,cy+3,W*.12,8);
  ctx.fillStyle='rgba(0,60,120,.12)';
  ctx.fillRect(W/2-W*.04,cy+5,W*.08,5);
  ctx.fillStyle='#0f0f0f';
  ctx.fillRect(W/2-W*.035,cy+25,W*.07,12);
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.arc(W/2,cy+32,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a00';
  ctx.beginPath();ctx.moveTo(W/2,cy+30);ctx.lineTo(W/2+2,cy+33);ctx.lineTo(W/2-2,cy+33);ctx.fill();

  // Koltuklar
  ctx.fillStyle='#120805';ctx.fillRect(0,cy+35,W,H-cy-35);
  for(let s=-1;s<=1;s+=2){
    ctx.fillStyle='#1a0a05';const kx2=W/2+s*W*.14;
    ctx.fillRect(kx2-W*.05,cy+38,W*.1,55);
    ctx.fillRect(kx2-W*.05,cy+30,W*.1,12);
    ctx.fillStyle='rgba(60,40,30,.25)';ctx.fillRect(kx2-W*.035,cy+41,W*.07,45);
  }

  // Far ışığı
  if(fa){const grd=ctx.createRadialGradient(cx,cy+100,0,cx,cy+100,W*.4);grd.addColorStop(0,'rgba(255,255,200,.035)');grd.addColorStop(.3,'rgba(255,255,200,.015)');grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H)}

  // HUD
  document.getElementById('dr').textContent=Math.round(d);
  document.getElementById('dd').style.width=`${Math.min(100,d/7500*100)}%`;
  document.getElementById('vh').textContent=va;
  document.getElementById('hk').textContent=km;
  document.getElementById('hm').textContent=Math.round(km*.621);
  document.getElementById('dg').style.transform=`rotate(${dr*35}deg)`;
  document.querySelector('.hiz').innerHTML=`${km}<small>KM/H</small>`;
  document.getElementById('dbg').textContent=`hız:${km} devir:${Math.round(d)} vites:${va} yön:${dr.toFixed(2)} araç:${tf.length}`;

  requestAnimationFrame(loop);
}

// Başlat
sesB();
requestAnimationFrame(loop);
</script>
</body>
</html>
